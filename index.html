<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workspace Hurting</title>
    <style>
        /* Сбрасываем отступы, чтобы iframe занял весь экран */

            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f5f5f5; /* Цвет фона на случай загрузки */
        }
        iframe {
            display: block;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
</head>
